# Builds the installers and command-line tool for every system and attaches
# them to a draft GitHub release. Start it by pushing a tag like `v0.1.0`.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Full Recovery ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your computer:
            - **Windows:** the `.msi` or `-setup.exe` file
            - **macOS:** the `.dmg` file
            - **Linux:** the `.AppImage` (any distribution) or `.deb` (Ubuntu, Debian)

            The `fullrecovery-cli-*` archives contain the command-line tool.
          releaseDraft: true
          args: ${{ matrix.args }}

  cli:
    name: Command-line tool (${{ matrix.os }})
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: fullrecovery-cli-windows-x64.zip
          - os: macos-latest
            archive: fullrecovery-cli-macos-arm64.tar.gz
          - os: ubuntu-22.04
            archive: fullrecovery-cli-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p fullrecovery-cli
      - name: Package
        shell: bash
        run: |
          cd target/release
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "../../${{ matrix.archive }}" fullrecovery.exe
          else
            tar czf "../../${{ matrix.archive }}" fullrecovery
          fi
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ matrix.archive }}" --clobber
