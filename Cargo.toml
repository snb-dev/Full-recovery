[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "apps/desktop/src-tauri"]
# The desktop app needs system libraries (WebKitGTK on Linux); build it with
# `cargo build -p fullrecovery-desktop`.
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snb-dev/Full-recovery"
rust-version = "1.82"

[workspace.dependencies]
fullrecovery-core = { path = "crates/core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
flate2 = "1"
indicatif = "0.18"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
